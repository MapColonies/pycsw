{{- if .Values.nginx.enabled -}}
{{- $chartName := include "pycsw.name" . -}}
{{- $releaseName := .Release.Name -}}
{{- $nginxConfigmapName := include "pycsw.nginx-configmap.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $nginxConfigmapName }}
  labels:
    app: {{ $releaseName }}-{{ $chartName }}
    component: nginx-configmap
    environment: {{ .Values.environment }}
    release: {{ $releaseName }}
data:
  location.conf: {{ tpl (.Files.Get "config/location.conf") . | quote }}
  server.conf: {{ tpl (.Files.Get "config/server.conf") . | quote }}
{{- end }}
