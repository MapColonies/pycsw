[server]
home=.
url=http://localhost:8000/csw
mimetype=application/xml; charset=UTF-8
encoding=UTF-8
language=en-US
maxrecords=10
loglevel=DEBUG
logfile=/tmp/pycsw-poc.log
profiles=liran_v1,liran_v2,liran_v3

[manager]
transactions=false
allowed_ips=127.0.0.1

[metadata:main]
