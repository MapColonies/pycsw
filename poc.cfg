identification_accessconstraints=None
provider_name=MapColonies
provider_url=https://mapcolonies.com/
contact_name=MapColonies
contact_position=Dev
contact_address=TBA
contact_city=TBA
contact_stateorprovince=TBA
contact_postalcode=TBA
contact_country=IL
contact_phone=+972-xxx-xxx-xxxx
contact_fax=+972-xxx-xxx-xxxx
contact_email=info@mapcolonies.com
contact_url=https://mapcolonies.com/
contact_hours=0800h - 1700h IST
contact_instructions=During hours of service.
contact_role=pointOfContact

[repository]
database=postgresql://postgres:pocpass@localhost/pycsw_poc
table=records
mappings=helm/config/mappings.py
